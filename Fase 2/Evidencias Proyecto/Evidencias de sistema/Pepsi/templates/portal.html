<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal | Pepsi transportes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#0b4faa;
      --white:#f5f7fb;
      --btn:#dedede;
      --bg:#000;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; min-height:100svh; color:var(--white);
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
      background: var(--bg) no-repeat center/cover
        url("{{ url_for('static', filename='img/pepsi fondo principal.png') }}");
      position:relative;
    }
    body::before{
      content:""; position:fixed; inset:0;
      background: radial-gradient(1200px 800px at 50% 0%, rgba(0,0,0,.35), rgba(0,0,0,.75));
      pointer-events:none;
    }

    /* ===== Franja azul superior + logo centrado verticalmente ===== */
    .topbar{
      position:fixed; inset:0 0 auto 0;
      height:84px;
      background:var(--blue);
      display:flex; align-items:center;
      justify-content:flex-start;
      padding-left:25px;
      padding-top: 80px;
      z-index:5px;
      box-shadow:0 2px 10px rgba(0,0,0,.35);
    }

    .logo-wrap{
      width:100px; height:100px;
      background:#000000;                  /* aro blanco */
      border-radius:99999px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 3px 8px rgba(0,0,0,.35);
    }

    .logo-wrap img{
      width:90px; height:90px;
      object-fit:contain;
      border-radius:10%;
    }

    /* ===== Contenedor principal ===== */
    .wrap{ width:min(1200px,94%); margin:120px auto 140px; position:relative; z-index:1; }

    /* ===== Bloque de saludo + buscador ===== */
    .greet{ max-width:760px; background:transparent; }
    .greet h1{
      margin:0 0 14px; font-weight:800; font-size:clamp(18px,2.2vw,28px);
      text-shadow:0 2px 8px rgba(0,0,0,.45);
      line-height:1.25;
    }

    /* ===== Barra de búsqueda ===== */
    .search{
      display:flex; align-items:center; gap:10px;
      background:transparent;
      border:2px solid #fff;
      border-radius:28px;
      padding:8px 8px 8px 16px;
      width:min(520px,100%);
      box-shadow:0 6px 18px rgba(0,0,0,.35);
      backdrop-filter: blur(3px);
    }
    .search input{
      flex:1; border:0; outline:0; background:transparent; color:var(--white);
      font-size:14px;
    }
    .search .search-btn{
      width:36px; height:36px; border-radius:9999px; border:2px solid #fff;
      display:inline-flex; align-items:center; justify-content:center;
      background:transparent; color:#fff; cursor:pointer;
    }
    .search .search-btn svg{ width:18px; height:18px; }

    /* ===== Columna de botones ===== */
    .stack{
      position:absolute;
      left:55%;
      top:0;
      transform:translateX(-10%);
      display:flex; flex-direction:column; gap:22px;
      width:380px;
      max-width:90vw;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:18px 26px;
      min-width:360px;
      border-radius:28px;
      background:var(--btn); color:#1b1b1b; font-weight:800; border:0; cursor:pointer;
      font-size:16px;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      text-decoration:none;
    }
    .btn:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(0,0,0,.30) }

    /* ===== Footer Pepsi ===== */
    .footer-pepsi{
      position:fixed; left:0; right:0; bottom:0;
      background:#0b4faa;
      color:#fff;
      display:flex; align-items:center; justify-content:space-between;
      gap:24px; padding:14px 28px;
      z-index:5;
      border-top:2px solid rgba(0,0,0,.6);
      font-size:16px;
    }
    .footer-pepsi .footer-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
    .footer-pepsi .footer-right{ align-items:center; text-align:center; }
    .footer-pepsi .footer-title{ font-weight:800; }
    .footer-pepsi .footer-icons{ display:flex; gap:18px; align-items:center; }
    .footer-pepsi .footer-icons a{
      color:#fff; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
      opacity:.95;
    }
    .footer-pepsi .footer-icons a:hover{ opacity:1; transform:translateY(-1px); }
    .footer-pepsi .footer-link{ color:#cfe2ff; text-decoration:none; font-weight:600; }
    .footer-pepsi .footer-link:hover{ text-decoration:underline; }

    @media (max-width:1200px){
      .stack{ left:58%; transform:translateX(-15%); }
    }
    @media (max-width:980px){
      .stack{ position:static; transform:none; width:100%; margin-top:28px; align-items:stretch; }
      .btn{ width:100%; min-width:0; }
    }
    @media (max-width:640px){
      .footer-pepsi{ flex-direction:column; gap:10px; padding:12px 16px; }
    }
  </style>
</head>
<body>

  <!-- franja azul + logo alineado al centro vertical -->
  <div class="topbar">
    <div class="logo-wrap">
      <img src="{{ url_for('static', filename='img/logo-pepsi.png') }}" alt="Pepsi">
    </div>
  </div>

  <main class="wrap">
    <section class="greet">
      <h1>Estamos aquí para ayudar.</h1>

      <form class="search" role="search" aria-label="Buscar" action="#" method="get">
        <input type="search" name="q" placeholder="Buscar..." aria-label="Buscar">
        <button class="search-btn" type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20l-6-6zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </form>
    </section>

    <!-- botones -->
    <aside class="stack">
      <form action="{{ url_for('agenda') }}" method="get"><button class="btn" type="submit">agenda movil</button></form>
      <form action="{{ url_for('estado_vehiculos') }}" method="get"><button class="btn" type="submit">actualizar estado de vehículos</button></form>
      <form action="{{ url_for('seguimiento') }}" method="get"><button class="btn" type="submit">seguimiento de vehículos</button></form>
      <form action="{{ url_for('contactar_chofer') }}" method="get"><button class="btn" type="submit">Contactar Chofer</button></form>
      <form action="{{ url_for('logout') }}" method="post" onsubmit="return confirm('¿Cerrar sesión?')">
        <button class="btn" type="submit">Cerrar Sesión</button>
      </form>
    </aside>
  </main>

  <!-- footer -->
  <footer class="footer-pepsi">
    <div class="footer-col">
      <div class="footer-title">Conéctate con nosotros</div>
      <div class="footer-icons" aria-label="Redes sociales">
        <a href="#" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 2 .2 2.4.4.6.2 1 .4 1.5.9.5.5.7.9.9 1.5.2.4.3 1.2.4 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.2 2-.4 2.4-.2.6-.4 1-.9 1.5-.5.5-.9.7-1.5.9-.4.2-1.2.3-2.4.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-2-.2-2.4-.4-.6-.2-1-.4-1.5-.9-.5-.5-.7-.9-.9-1.5-.2-.4-.3-1.2-.4-2.4C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.2-2 .4-2.4.2-.6.4-1 .9-1.5.5-.5.9-.7 1.5-.9.4-.2 1.2-.3 2.4-.4C8.4 2.2 8.8 2.2 12 2.2Zm0 1.8c-3.1 0-3.5 0-4.8.1-1 .1-1.5.2-1.9.3-.5.2-.8.4-1.1.7-.3.3-.5.6-.7 1.1-.1.4-.3.9-.3 1.9-.1 1.3-.1 1.7-.1 4.8s0 3.5.1 4.8c.1 1 .2 1.5.3 1.9.2.5.4.8.7 1.1.3.3.6.5 1.1.7.4.1.9.3 1.9.3 1.3.1 1.7.1 4.8.1s3.5 0 4.8-.1c1-.1 1.5-.2 1.9-.3.5-.2.8-.4 1.1-.7.3-.3.5-.6.7-1.1.1-.4.3-.9.3-1.9.1-1.3.1-1.7.1-4.8s0-3.5-.1-4.8c-.1-1-.2-1.5-.3-1.9-.2-.5-.4-.8-.7-1.1a2.7 2.7 0 0 0-1.1-.7c-.4-.1-.9-.3-1.9-.3-1.3-.1-1.7-.1-4.8-.1Zm0 3.1a6.9 6.9 0 1 1 0 13.8 6.9 6.9 0 0 1 0-13.8Zm0 11.3a4.4 4.4 0 1 0 0-8.8 4.4 4.4 0 0 0 0 8.8Zm5.5-11.9a1.6 1.6 0 1 1 0 3.1 1.6 1.6 0 0 1 0-3.1Z"/></svg>
        </a>
        <a href="#" aria-label="Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.7V12h2.7V9.8c0-2.7 1.6-4.2 4-4.2 1.2 0 2.5.2 2.5.2v2.7h-1.4c-1.4 0-1.9.9-1.9 1.8V12h3.2l-.5 2.9h-2.7v7A10 10 0 0 0 22 12Z"/></svg>
        </a>
        <a href="#" aria-label="X" title="X (Twitter)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M18.9 3H22l-7.1 8.1L23 21h-7l-4.6-5.5L5.1 21H2l7.6-8.7L1 3h7l4.2 5.1L18.9 3Zm-2.5 16h1.9L7.7 5H5.7l10.7 14Z"/></svg>
        </a>
      </div>
    </div>
    <div class="footer-col footer-right">
      <div class="footer-title">Área de soporte</div>
      <a class="footer-link" href="#">Contáctese con nosotros</a>
    </div>
  </footer>

</body>
</html>
