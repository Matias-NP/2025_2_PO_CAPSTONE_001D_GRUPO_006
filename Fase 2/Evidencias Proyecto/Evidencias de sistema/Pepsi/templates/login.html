<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Pepsi transportes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#000; --white:#f5f7fb; --pill:#d8d8d8 }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0; display:grid; place-items:center; background:var(--bg);
      color:var(--white); font-family:Inter,system-ui,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
      padding:24px;
    }
    .wrap{ width:min(520px,94vw); display:flex; flex-direction:column; align-items:center }
    .logo{
      width:110px; height:110px; border-radius:999px; overflow:hidden; background:#fff;
      display:grid; place-items:center; box-shadow:0 10px 26px rgba(0,0,0,.45); border:3px solid #f0f0f0; margin-bottom:22px;
    }
    .logo img{ width:100%; height:100%; object-fit:cover }
    .error{ color:#ffb3b3; text-align:center; min-height:1.2em; margin-bottom:8px }
    form{ width:100%; display:grid; gap:18px; margin-top:8px }
    .pill{
      width:100%; border-radius:28px; border:0; outline:none;
      background:var(--pill); color:#222; padding:16px 18px; font-size:16px; text-align:center;
    }
    .pill::placeholder{ color:#6e6e6e }
    .btn{
      width:100%; border-radius:28px; border:0; padding:14px 18px;
      background:#2e64d8; color:#fff; font-weight:800; cursor:pointer;
    }
    .help{ text-align:center; margin-top:24px; line-height:1.4 }
    .help a{ color:#3b57ff; text-decoration:none }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="{{ url_for('static', filename='img/logo-pepsi.png') }}" alt="Pepsi"></div>

    <div class="error">
      {% with messages = get_flashed_messages() %}{% if messages %}{{ messages[0] }}{% endif %}{% endwith %}
    </div>

    <!-- Mantén el rol tanto en la URL como oculto en el POST -->
    <form action="{{ url_for('login', role=role) }}" method="post">
      <input type="hidden" name="role" value="{{ role }}">
      <input class="pill" id="email" name="email" type="email" placeholder="Correo" required>
      <input class="pill" id="password" name="password" type="password" placeholder="Contraseña" required minlength="6">
      <button class="btn" type="submit">Ingresar</button>
    </form>

    <div class="help">
      <div>Se le olvidó la contraseña</div>
      <a href="#">Contáctese con nosotros</a>
    </div>
  </div>
</body>
</html>
